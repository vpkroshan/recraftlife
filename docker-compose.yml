version: '3.9'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recraftlife-backend
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/recraftlife
      BASE_URL: http://localhost:3000
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: recraftlife-db
    environment:
      POSTGRES_DB: recraftlife
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
    container_name: recraftlife-admin
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
